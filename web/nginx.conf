# Static SPA server. TLS, HSTS and the HTTP->HTTPS redirect are handled by Traefik.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # blob: in media-src/worker-src is for hls.js (MediaSource + worker), used from Task 9.
  set $csp "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  # Hashed build output: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The app shell must always be revalidated so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
  }

  # Client-side routes fall back to the app shell.
  location / {
    add_header Content-Security-Policy $csp always;
    try_files $uri /index.html;
  }
}
