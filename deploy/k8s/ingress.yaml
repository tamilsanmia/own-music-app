# The cluster runs Traefik (microk8s ingress addon) with the shared ClusterIssuer letsencrypt-prod.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: music
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: music
spec:
  headers:
    stsSeconds: 31536000
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    customFrameOptionsValue: SAMEORIGIN
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music
  namespace: music
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: music-redirect-https@kubernetescrd,music-security-headers@kubernetescrd
spec:
  ingressClassName: public
  tls:
    - hosts: [music.snowsig.in]
      secretName: music-snowsig-in-tls
  rules:
    - host: music.snowsig.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 3000 } }
          - path: /stream
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 3000 } }
          - path: /media
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 3000 } }
          # Everything else is the React app. Traefik prefers the longer prefixes above.
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 8080 } }
