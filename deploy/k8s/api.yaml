apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: music
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: music
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      initContainers:
        - name: migrate
          image: music-server
          command: ["npx", "--no-install", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: music-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: music-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgresql://music:$(POSTGRES_PASSWORD)@postgres:5432/music?schema=public
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      containers:
        - name: api
          image: music-server
          envFrom:
            - configMapRef:
                name: music-config
            - secretRef:
                name: music-secrets
          env:
            - name: DATABASE_URL
              value: postgresql://music:$(POSTGRES_PASSWORD)@postgres:5432/music?schema=public
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: media
              mountPath: /srv/music
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
