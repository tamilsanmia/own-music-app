[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
composeBom = "2025.12.01"
activityCompose = "1.10.1"
coreKtx = "1.16.0"
lifecycle = "2.9.4"
navigation = "2.9.8"
hilt = "2.57.2"
